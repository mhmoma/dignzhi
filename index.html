        function applyResult(res, actionLabel) {
          gameState.isLoading = false;

          // 1. Stats
          if (res.statChanges) {
            Object.keys(res.statChanges).forEach((k) => {
              if (gameState.stats[k] !== undefined) {
                gameState.stats[k] = Math.min(100, Math.max(10, gameState.stats[k] + res.statChanges[k]));
              }
            });
          }

          // 2. NPCs
          if (res.npcUpdates) {
            res.npcUpdates.forEach((up) => {
              const npc = gameState.npcs[up.npcId];
              if (npc) {
                if (up.favorDelta) npc.favor = Math.min(100, Math.max(0, npc.favor + up.favorDelta));
                if (up.submissionDelta) npc.submission = Math.min(100, Math.max(0, npc.submission + up.submissionDelta));
                if (up.newMood) npc.memory = up.newMood;
                if (up.newSecret && !npc.secrets.includes(up.newSecret)) npc.secrets.push(up.newSecret);
              }
            });
          }

          // 3. Objects
          if (res.objectUpdates && res.objectUpdates.add) {
            res.objectUpdates.add.forEach((obj) => {
              if (!gameState.objects.some(o => o.id === obj.id)) {
                gameState.objects.push(obj);
              }
            });
          }

          // 4. Permanent Core Memories (防失忆核心机制)
          if (res.newCoreMemories && Array.isArray(res.newCoreMemories)) {
            res.newCoreMemories.forEach(mem => {
              if (typeof mem === 'string' && mem.trim() && !gameState.coreMemories.some(m => m.content === mem.trim())) {
                gameState.coreMemories.push({
                  id: 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                  tag: '推演锚定',
                  role: '关键事实',
                  content: mem.trim(),
                  pinned: true,
                  time: gameState.timeOfDay
                });
                showToast('🧠 [AI记忆已固化] ' + (mem.length > 18 ? mem.slice(0, 18) + '...' : mem));
              }
            });
          }

          // 5. Player Status Update
          if (res.playerStatusUpdate) {
            const pUp = res.playerStatusUpdate;
            if (pUp.condition) gameState.playerProfile.condition = pUp.condition;
            if (pUp.focusDelta) gameState.playerProfile.focusLevel = Math.min(100, Math.max(20, gameState.playerProfile.focusLevel + pUp.focusDelta));
            if (pUp.heartRateDelta) gameState.playerProfile.heartRate = Math.min(140, Math.max(55, gameState.playerProfile.heartRate + pUp.heartRateDelta));
            if (pUp.newBuff && pUp.newBuff.name) {
              if (!gameState.playerProfile.activeBuffs.some(b => b.name === pUp.newBuff.name)) {
                gameState.playerProfile.activeBuffs.push(pUp.newBuff);
                showToast('⚡ 获得新战术特质: ' + pUp.newBuff.name);
              }
            }
          }

          // 6. Scene
          gameState.currentScene = {
            title: res.title || gameState.currentScene.title,
            atmosphere: res.atmosphere || gameState.currentScene.atmosphere,
            narrative: res.narrative,
            choices: res.choices || []
          };

          if (res.timeOfDay) gameState.timeOfDay = res.timeOfDay;
          gameState.dialogueHistory.push({ role: 'player', content: actionLabel });
          gameState.dialogueHistory.push({ role: 'narrator', content: res.narrative });

          triggerAutoSave();
          render();
        }

                      <div style="background: rgba(10, 20, 36, 0.7); padding: 0.4rem 0.6rem; border: 1px solid #142846; font-size: 0.68rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.35rem;">
                        <span>赛事签约金: <strong style="color: #34d399;">¥${gameState.funds}</strong></span>
                        <span>天梯KDA: <strong style="color: #38bdf8;">${gameState.playerProfile.kda}</strong></span>
                        <span>手速峰值: <strong style="color: #f59e0b;">${gameState.playerProfile.peakApm} APM</strong></span>
                      </div>
                    </div>

                    <!-- Physiological & Psychological Telemetry -->
                    <div class="card" style="padding: 0.75rem; border-color: #1e3a5f;">
                      <div style="color: #38bdf8; font-weight: bold; margin-bottom: 0.35rem; display: flex; justify-content: space-between;">
                        <span>💓 实时生理与心智机能监控</span>
                        <span style="color: #00f0ff;">【${gameState.playerProfile.condition}】</span>
                      </div>
                      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem;">
                        <div style="background: rgba(10, 20, 36, 0.6); padding: 0.4rem; border: 1px solid #142846;">
                          <div style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.65rem;">
                            <span>脑波专注度 (Focus)</span>
                            <span style="color: #00f0ff; font-weight: bold;">${gameState.playerProfile.focusLevel}%</span>
                          </div>
                          <div style="width: 100%; height: 4px; background: #08111f; margin-top: 0.25rem;">
                            <div style="width: ${gameState.playerProfile.focusLevel}%; height: 100%; background: linear-gradient(90deg, #0284c7, #00f0ff);"></div>
                          </div>
                        </div>
                        <div style="background: rgba(10, 20, 36, 0.6); padding: 0.4rem; border: 1px solid #142846;">
                          <div style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.65rem;">
                            <span>静态心率 (Pulse)</span>
                            <span style="color: #34d399; font-weight: bold;">${gameState.playerProfile.heartRate} bpm</span>
                          </div>
                          <div style="width: 100%; height: 4px; background: #08111f; margin-top: 0.25rem;">
                            <div style="width: ${(gameState.playerProfile.heartRate / 120) * 100}%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399);"></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- Active Traits & Buffs -->
                    <div class="card" style="padding: 0.75rem; border-color: #1e3a5f;">
                      <div style="color: #a78bfa; font-weight: bold; margin-bottom: 0.35rem;">
                        ⚡ 激活中的战术特质与光环 (Active Buffs)
                      </div>
                      <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                        ${gameState.playerProfile.activeBuffs.map(b => `
                          <div style="background: rgba(15, 23, 42, 0.6); padding: 0.35rem 0.5rem; border: 1px solid #1e3a5f; display: flex; flex-direction: column; gap: 0.15rem;">
                            <div style="color: #67e8f9; font-weight: bold; font-size: 0.7rem;">• 【${b.name}】</div>
                            <div style="font-size: 0.65rem; color: #94a3b8;">${b.desc}</div>
                          </div>
                        `).join('')}
                      </div>
                    </div>

                    <!-- Held Tactical Objects & Leverage -->
                    <div class="card" style="padding: 0.75rem; border-color: #1e3a5f;">
                      <div style="color: #fbbf24; font-weight: bold; margin-bottom: 0.35rem;">
                        🔒 随身私密道具与支配把柄 (${gameState.objects.length}件)
                      </div>
                      ${gameState.objects.map(o => `
                        <div style="margin-bottom: 0.35rem; background: rgba(10, 20, 36, 0.6); padding: 0.35rem 0.5rem; border: 1px solid #142846;">
                          <div style="color: #fde68a; font-weight: bold;">• 【${o.name}】 <span class="badge badge-amber" style="font-size: 0.55rem;">${o.riskLevel}</span></div>
                          <div style="color: #94a3b8; font-size: 0.65rem;">${o.description}</div>
                        </div>
                      `).join('')}
                    </div>

                    <!-- Heroine Subjugation & Sentiment Ledger -->
                    <div class="card" style="padding: 0.75rem; border-color: #1e3a5f;">
                      <div style="color: #38bdf8; font-weight: bold; margin-bottom: 0.35rem;">
                        👥 四女主好感羁绊与屈服度一览
                      </div>
                      ${Object.values(gameState.npcs).map(n => `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.25rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                          <span>${n.name} (${n.kplRole || n.role})</span>
                          <div style="display: flex; gap: 0.4rem; font-family: monospace;">
                            <span style="color: #38bdf8;">好感:${n.favor}%</span>
                            <span style="color: #00f0ff;">屈服:${n.submission}%</span>
                          </div>
                        </div>
                      `).join('')}
                    </div>

                  </div>
                </div>
              </div>
            `;
          }

          // 5. Save System Modal
          if (gameState.ui.showSaveModal) {
            const slots = getSaveSlots();
            const auto = getAutoSave();

            html += `
              <div class="drawer-overlay" id="modal-overlay">
                <div class="drawer-content">
                  <div class="drawer-header">
                    <strong style="font-size: 0.8rem; color: white;">💾 战术数据档案管理 (SAVES)</strong>
                    <button class="modal-close-x" style="background: none; color: var(--text-muted); font-size: 1.25rem;">×</button>
                  </div>
                  <div class="drawer-body">
                    <div class="card" style="border-style: dashed; padding: 0.6rem 0.75rem;">
                      <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.25rem;">
                        <span>[实时自动存档]</span>
                        <span>${auto ? auto.updatedAt : '暂无'}</span>
                      </div>
                      ${auto ? `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                          <div style="font-size: 0.75rem; color: white;">${auto.title}</div>
                          <button class="btn-primary" data-load-auto="true" style="padding: 0.3rem 0.6rem; font-size: 0.7rem;">载入</button>
                        </div>
                      ` : '<div style="font-size: 0.7rem; color: var(--text-muted);">推演中会自动实时存储</div>'}
                    </div>

                    ${[1, 2, 3].map(slotNum => {
                      const s = slots[slotNum - 1];
                      return `
                        <div class="card" style="padding: 0.6rem 0.75rem;">
                          <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.25rem;">
                            <strong>SLOT 0${slotNum}</strong>
                            <span>${s ? s.updatedAt : '空'}</span>
                          </div>
                          ${s ? `
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                              <div>
                                <div style="font-size: 0.8rem; font-weight: bold; color: white;">${s.title}</div>
                                <div style="font-size: 0.65rem; color: var(--text-muted);">${s.name} · ${s.role} · 林鸢屈服: ${s.npcs?.lin_yuan?.submission || 0}%</div>
                              </div>
                              <div style="display: flex; gap: 0.35rem;">
                                ${gameState.stage === 'GAMEPLAY' ? `<button class="btn-subtle" data-save-slot="${slotNum}">覆盖</button>` : ''}
                                <button class="btn-primary" data-load-slot="${slotNum}" style="padding: 0.3rem 0.6rem; font-size: 0.7rem;">载入</button>
                                <button class="btn-subtle" data-del-slot="${slotNum}" style="color: #64748b;">删</button>
                              </div>
                            </div>
                          ` : `
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                              <span style="font-size: 0.75rem; color: var(--text-muted);">空槽位</span>
                              ${gameState.stage === 'GAMEPLAY' ? `<button class="btn-primary" data-save-slot="${slotNum}" style="padding: 0.3rem 0.6rem; font-size: 0.7rem;">保存至此</button>` : ''}
                            </div>
                          `}
                        </div>
                      `;
                    }).join('')}

                    <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                      <button id="btn-export-saves" class="btn-secondary" style="flex: 1; font-size: 0.7rem; padding: 0.4rem;">导出本地 JSON</button>
                      <button id="btn-import-saves" class="btn-secondary" style="flex: 1; font-size: 0.7rem; padding: 0.4rem;">导入 JSON</button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }

          return html;
        }

        function attachModals() {
          document.querySelectorAll('.modal-close-x').forEach(btn => {
            btn.onclick = () => {
              gameState.ui.showMapModal = false;
              gameState.ui.showNPCModal = false;
              gameState.ui.showStatusPanel = false;
              gameState.ui.showSaveModal = false;
              gameState.ui.showMemoryModal = false;
              render();
            };
          });

          const overlay = document.getElementById('modal-overlay');
          if (overlay) {
            overlay.onclick = (e) => {
              if (e.target === overlay) {
                gameState.ui.showMapModal = false;
                gameState.ui.showNPCModal = false;
                gameState.ui.showStatusPanel = false;
                gameState.ui.showSaveModal = false;
                gameState.ui.showMemoryModal = false;
                render();
              }
            };
          }

          // Memory Add & Delete
          const btnAddMem = document.getElementById('btn-add-pin-memory');
          const inputMem = document.getElementById('input-pin-memory');
          if (btnAddMem && inputMem) {
            btnAddMem.onclick = () => {
              const val = inputMem.value.trim();
              if (!val) return;
              playSfx('confirm');
              gameState.coreMemories.push({
                id: 'custom_' + Date.now(),
                tag: '玩家指令',
                role: '核心固化',
                content: val,
                pinned: true,
                time: gameState.timeOfDay
              });
              inputMem.value = '';
              showToast('已固化至AI核心记忆库！');
              triggerAutoSave();
              render();
            };
          }

          document.querySelectorAll('[data-del-mem]').forEach(btn => {
            btn.onclick = () => {
              const idx = parseInt(btn.getAttribute('data-del-mem'), 10);
              if (!isNaN(idx)) {
                gameState.coreMemories.splice(idx, 1);
                showToast('已从AI记忆库中移除');
                triggerAutoSave();
                render();
              }
            };
          });

          // Map Travel Click
          document.querySelectorAll('[data-move-to]').forEach(btn => {
            btn.onclick = () => {
              const target = btn.getAttribute('data-move-to');
              gameState.ui.showMapModal = false;
              runStoryStep(null, target);
            };
          });

          // Save / Load / Delete Slots
          document.querySelectorAll('[data-save-slot]').forEach(b => {
            b.onclick = () => saveToSlot(parseInt(b.getAttribute('data-save-slot'), 10));
          });
          document.querySelectorAll('[data-load-slot]').forEach(b => {
            b.onclick = () => {
              const slots = getSaveSlots();
              loadFromSlot(slots[parseInt(b.getAttribute('data-load-slot'), 10) - 1]);
            };
          });
          const loadAuto = document.querySelector('[data-load-auto]');
          if (loadAuto) {
            loadAuto.onclick = () => loadFromSlot(getAutoSave());
          }
          document.querySelectorAll('[data-del-slot]').forEach(b => {
            b.onclick = () => {
              const num = parseInt(b.getAttribute('data-del-slot'), 10);
              localStorage.removeItem(SLOT_KEY + num);
              showToast('已删除槽位 0' + num);
            };
          });

          // Export/Import
          const expBtn = document.getElementById('btn-export-saves');
          if (expBtn) {
            expBtn.onclick = () => {
              const data = {
                auto: getAutoSave(),
                slots: getSaveSlots(),
                exportedAt: new Date().toISOString()
              };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `chixiao_saves_${Date.now()}.json`;
              a.click();
              URL.revokeObjectURL(url);
              showToast('存档已成功导出为文件');
            };
          }

          const impBtn = document.getElementById('btn-import-saves');
          if (impBtn) {
            impBtn.onclick = () => {
              const str = prompt('请粘贴您导出的 JSON 存档数据：');
              if (!str) return;
              try {
                const parsed = JSON.parse(str);
                if (parsed.auto) localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(parsed.auto));
                if (Array.isArray(parsed.slots)) {
                  parsed.slots.forEach((s, i) => {
                    if (s) localStorage.setItem(SLOT_KEY + (i + 1), JSON.stringify(s));
                  });
                }
                showToast('存档已成功导入！');
                render();
              } catch {
                alert('非法的 JSON 存档数据格式！');
              }
            };
          }
        }

        // --- Bootstrap Game Engine ---
        window.addEventListener('DOMContentLoaded', () => {
          render();
        });
      })();
    </script>
  </body>
</html>
